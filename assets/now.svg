<g class="r" style="animation-delay:0.45s"><rect x="28" y="95" width="4" height="14" rx="2" fill="#8be9fd"/><text x="42" y="106" fill="#ffffff" font-size="14" font-weight="600">Multi-Agent Systems</text><text x="228" y="106" fill="#8b949e" font-size="13">LangGraph orchestration</text></g>
<g class="r" style="animation-delay:0.70s"><rect x="28" y="125" width="4" height="14" rx="2" fill="#2cb67d"/><text x="42" y="136" fill="#ffffff" font-size="14" font-weight="600">RAG Pipelines</text><text x="228" y="136" fill="#8b949e" font-size="13">grounded, cited answers</text></g>
<g class="r" style="animation-delay:0.95s"><rect x="28" y="155" width="4" height="14" rx="2" fill="#fbbf24"/><text x="42" y="166" fill="#ffffff" font-size="14" font-weight="600">LLM Evaluation</text><text x="228" y="166" fill="#8b949e" font-size="13">RAGAS · LangSmith · MLflow</text></g>
