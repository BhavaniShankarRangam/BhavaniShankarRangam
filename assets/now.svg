<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="440" height="195" viewBox="0 0 440 195" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f5af0"/><stop offset="1" stop-color="#302b63"/></linearGradient>
<style>
.r{opacity:0;animation:in .5s ease-out forwards}
